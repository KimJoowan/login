spring.application.name=test01

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 스프링 부트 배너 끄기
spring.main.banner-mode=off

# PostgreSQL 드라이버
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis
mybatis.mapper-locations=classpath:/mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Thymeleaf 사용 안 함
spring.thymeleaf.enabled=false

# 비밀정보는 환경변수에서 가져옴
myapp.security.pepper=${PASSWORD_PEPPER}
myapp.security.rate-limit-hmac-key=${RATE_LIMIT_HMAC_KEY}

# 오류 정보 노출 방지
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never

# app.rate-limit.login.ip
app.rate-limit.login.ip.capacity=10
app.rate-limit.login.ip.refillTokens=10
app.rate-limit.login.ip.refillPeriod=PT1M

# app.rate-limit.login.account
app.rate-limit.login.account.capacity=5
app.rate-limit.login.account.refillTokens=5
app.rate-limit.login.account.refillPeriod=PT1M

# app.rate-limit.signup.ip
app.rate-limit.signup.ip.capacity=3
app.rate-limit.signup.ip.refillTokens=3
app.rate-limit.signup.ip.refillPeriod=PT5M

# app.rate-limit.check-id.ip
app.rate-limit.check-id.ip.capacity=20
app.rate-limit.check-id.ip.refillTokens=20
app.rate-limit.check-id.ip.refillPeriod=PT1M

# app.rate-limit.cache
app.rate-limit.cache.maximumSize=10000
app.rate-limit.cache.expireAfterAccess=PT10M

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}

management.server.port=8081


















