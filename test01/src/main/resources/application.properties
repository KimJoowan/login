spring.application.name=test01

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 스프링 부트 배너 끄기
spring.main.banner-mode=off

# PostgreSQL 드라이버
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis
mybatis.mapper-locations=classpath:/mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Thymeleaf 사용 안 함
spring.thymeleaf.enabled=false

# 비밀정보는 환경변수에서 가져옴
myapp.security.pepper=${PASSWORD_PEPPER}
myapp.security.rate-limit-hmac-key=${RATE_LIMIT_HMAC_KEY}

# 오류 정보 노출 방지
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never

# 세션 쿠키 공통 보안 설정
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Rate Limit
app.rate-limit.login.ip.capacity=30
app.rate-limit.login.ip.refill-tokens=30
app.rate-limit.login.ip.refill-period=15m

app.rate-limit.login.account.capacity=5
app.rate-limit.login.account.refill-tokens=5
app.rate-limit.login.account.refill-period=15m

app.rate-limit.signup.ip.capacity=5
app.rate-limit.signup.ip.refill-tokens=5
app.rate-limit.signup.ip.refill-period=1h

app.rate-limit.check-id.ip.capacity=30
app.rate-limit.check-id.ip.refill-tokens=30
app.rate-limit.check-id.ip.refill-period=1m