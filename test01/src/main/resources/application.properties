spring.application.name=test01

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 스프링 부트 배너 끄기
spring.main.banner-mode=off

# PostgreSQL 드라이버
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis
mybatis.mapper-locations=classpath:/mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Thymeleaf 사용 안 함
spring.thymeleaf.enabled=false

# 비밀정보는 환경변수에서 가져옴
myapp.security.pepper=${PASSWORD_PEPPER}
myapp.security.rate-limit-hmac-key=${RATE_LIMIT_HMAC_KEY}

# 오류 정보 노출 방지
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never

# Login: IP + account
app.rate-limit.policies.login.path=/member/login
app.rate-limit.policies.login.methods=POST
app.rate-limit.policies.login.response-format=HTML
app.rate-limit.policies.login.limits.ip.capacity=10
app.rate-limit.policies.login.limits.ip.refill-tokens=10
app.rate-limit.policies.login.limits.ip.refill-period=PT1M
app.rate-limit.policies.login.limits.account.capacity=5
app.rate-limit.policies.login.limits.account.refill-tokens=5
app.rate-limit.policies.login.limits.account.refill-period=PT1M

# Signup: IP
app.rate-limit.policies.signup.path=/member/signup
app.rate-limit.policies.signup.methods=POST
app.rate-limit.policies.signup.response-format=HTML
app.rate-limit.policies.signup.limits.ip.capacity=3
app.rate-limit.policies.signup.limits.ip.refill-tokens=3
app.rate-limit.policies.signup.limits.ip.refill-period=PT5M

# Check ID: IP
app.rate-limit.policies.check-id.path=/member/check-id
app.rate-limit.policies.check-id.methods=GET,HEAD
app.rate-limit.policies.check-id.response-format=JSON
app.rate-limit.policies.check-id.limits.ip.capacity=20
app.rate-limit.policies.check-id.limits.ip.refill-tokens=20
app.rate-limit.policies.check-id.limits.ip.refill-period=PT1M

# app.rate-limit.cache
app.rate-limit.cache.maximum-size=10000
app.rate-limit.cache.expire-after-access=PT10M

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}

management.server.port=8081
















