# Local development (default profile)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/test}
spring.datasource.username=${LOCAL_DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

myapp.security.pepper=${PASSWORD_PEPPER}

# Allow the session cookie over local HTTP.
server.servlet.session.cookie.secure=false
server.forward-headers-strategy=none
