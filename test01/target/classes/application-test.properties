# Tests must use a database separate from local and production data.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/test01_test}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}

myapp.security.pepper=${TEST_PASSWORD_PEPPER:test-only-pepper-not-for-production}

server.servlet.session.cookie.secure=false
server.forward-headers-strategy=none
